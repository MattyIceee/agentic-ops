[project]
name = "ops-agent"
version = "0.1.0"
description = "Agentic ops pipeline for Renovate PR review and deployment scaffolding"
requires-python = ">=3.11"
dependencies = [
    "gitpython>=3.1.57",
    "html2text>=2025.4.15",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.9",
    "langfuse>=2.60.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "tenacity>=9.1.4",
]

[project.scripts]
ops-agent = "ops_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_agent"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
