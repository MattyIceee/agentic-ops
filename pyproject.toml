[project]
name = "ops-agent"
version = "0.1.0"
description = "Agentic ops pipeline for Renovate PR review and deployment scaffolding"
requires-python = ">=3.11"
dependencies = [
    "gitpython>=3.1.57",
    "githubkit>=0.13,<0.14",
    "html2text>=2025.4.15",
    "httpx>=0.28.1",
    "langchain",
    "langchain-community",
    "langchain-openai",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "psycopg[binary]",
    "langfuse",
    "chromadb",
    "langchain-chroma",
    "langchain-text-splitters",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
]

[project.scripts]
ops-agent = "ops_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_agent"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Graph nodes and CLI entry points intentionally catch Exception and degrade
# gracefully instead of crashing the run — see docs/NODE_ERROR_HANDLING.md.
extend-ignore = ["BLE001"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
