version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ops-agent-postgres
    environment:
      POSTGRES_USER: ops_agent
      POSTGRES_PASSWORD: ops_agent_dev_password
      POSTGRES_DB: ops_agent_checkpoints
    ports:
      - "5432:6432"
    volumes:
      - ops_agent_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ops_agent_postgres_data:
