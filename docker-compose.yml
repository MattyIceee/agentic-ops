version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ops-agent-postgres
    environment:
      POSTGRES_USER: ops_agent
      POSTGRES_PASSWORD: ops_agent_dev_password
      POSTGRES_DB: ops_agent_checkpoints
    ports:
      - "5432:6432"
    volumes:
      - ops_agent_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-langfuse.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: ops-agent-clickhouse
    environment:
      CLICKHOUSE_DB: langfuse
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: langfuse_dev_password
    volumes:
      - ops_agent_clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ops-agent-redis
    volumes:
      - ops_agent_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  garage:
    image: ghcr.io/deuxfleurs-org/garage:v1.0.0
    container_name: ops-agent-garage
    environment:
      GARAGE_RPC_SECRET: dev-rpc-secret-changeme
    volumes:
      - ./docker/garage.toml:/etc/garage.toml
      - ops_agent_garage_data:/var/lib/garage
    ports:
      - "3900:3900"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3903/status"]
      interval: 10s
      timeout: 5s
      retries: 5

  garage-init:
    image: ghcr.io/deuxfleurs-org/garage:v1.0.0
    container_name: ops-agent-garage-init
    depends_on:
      garage:
        condition: service_healthy
    volumes:
      - ./docker/garage-init.sh:/garage-init.sh
      - ops_agent_garage_keys:/garage-keys
    entrypoint: ["/bin/sh", "/garage-init.sh"]
    restart: on-failure

  langfuse-web:
    image: langfuse/langfuse:3
    container_name: ops-agent-langfuse-web
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://ops_agent:ops_agent_dev_password@postgres:5432/langfuse
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: langfuse_dev_password
      REDIS_CONNECTION_STRING: redis://redis:6379
      LANGFUSE_S3_ENDPOINT: http://garage:3900
      LANGFUSE_S3_BUCKET: langfuse-media
      LANGFUSE_S3_REGION: garage
      NEXTAUTH_SECRET: changeme-dev-nextauth-secret
      NEXTAUTH_URL: http://localhost:3000
      TELEMETRY_ENABLED: "false"
    env_file:
      - ops_agent_garage_keys/s3-credentials
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: ops-agent-langfuse-worker
    depends_on:
      langfuse-web:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ops_agent:ops_agent_dev_password@postgres:5432/langfuse
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: langfuse_dev_password
      REDIS_CONNECTION_STRING: redis://redis:6379
      LANGFUSE_S3_ENDPOINT: http://garage:3900
      LANGFUSE_S3_BUCKET: langfuse-media
      LANGFUSE_S3_REGION: garage
      TELEMETRY_ENABLED: "false"
    env_file:
      - ops_agent_garage_keys/s3-credentials

volumes:
  ops_agent_postgres_data:
  ops_agent_clickhouse_data:
  ops_agent_redis_data:
  ops_agent_garage_data:
  ops_agent_garage_keys:
